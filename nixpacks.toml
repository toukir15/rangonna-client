# Rangonaa frontend (Next.js)
# Used by Railway / Coolify / Nixpacks deployments

[variables]
NIXPACKS_NODE_VERSION = "22"
NEXT_TELEMETRY_DISABLED = "1"

[phases.setup]
nixPkgs = ["...", "openssl"]

[phases.install]
# --ignore-engines: Coolify Nixpacks Node is 22.11.0, some deps need ^22.13.0
cmds = ["yarn install --frozen-lockfile --ignore-engines"]

[phases.build]
cmds = ["yarn build"]

[start]
cmd = "yarn start"
