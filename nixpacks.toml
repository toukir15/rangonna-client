# Rangonaa frontend (Next.js)
# Used by Railway / Coolify / Nixpacks deployments

[variables]
NIXPACKS_NODE_VERSION = "22"
NEXT_TELEMETRY_DISABLED = "1"

[phases.setup]
nixPkgs = ["nodejs_22", "yarn", "openssl"]

[phases.install]
# Yarn engine checks fail if Nixpacks still pins an older Node patch.
cmds = ["yarn install --frozen-lockfile --ignore-engines"]

[phases.build]
cmds = ["yarn build"]

[start]
cmd = "yarn start"
